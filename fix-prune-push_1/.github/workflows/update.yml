name: daily-update

on:
  schedule:
    - cron: "0 21 * * *"     # 매일 21:00 UTC = 06:00 KST
  workflow_dispatch:
    inputs:
      bid_days:
        description: "입찰공고 수집 일수 (기본 7, 최초 백필 30)"
        required: false
        default: "7"
      contract_days:
        description: "계약 수집 일수 (기본 7, 최초 백필 90)"
        required: false
        default: "7"

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

env:
  DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
  # 사이트 빌드는 누적 저장소를 읽는다 (radar.sqlite3 은 당일 수집 임시 파일)
  KR_DB: data/kr_store.sqlite3
  BID_DAYS: ${{ github.event.inputs.bid_days || '7' }}
  CT_DAYS: ${{ github.event.inputs.contract_days || '7' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests pyyaml

      # 한국 나라장터 수집 (Secret DATA_GO_KR_KEY 등록 시에만 실행)
      #  1) 최근 N일치만 radar.sqlite3 에 수집 (매 실행 새로 생성, 커밋 안 함)
      #  2) merge-store 가 업종(CCTV·물리보안) 키워드 일치분만
      #     kr_store.sqlite3 로 병합 — 이 파일은 커밋되어 매일 누적된다
      - name: Collect KR (nara-jangteo)
        if: ${{ env.DATA_GO_KR_KEY != '' }}
        continue-on-error: true
        run: |
          python run_kr.py init
          python run_kr.py collect --days $BID_DAYS
          python run_kr.py collect-contracts --days $CT_DAYS
          python run_kr.py merge-store

      # 미국 APFS 라이브 수집 + 정적 사이트 빌드
      - name: Build site
        run: python build_site.py

      # 변화 엔진: 일일 스냅샷 축적 + diff + 브리프
      - name: Snapshot & diff
        continue-on-error: true
        run: |
          python run_platform.py --source us snapshot
          python run_platform.py --source us diff
          python run_platform.py --source us --lang en --min medium brief

      - name: Commit updated data
        run: |
          git config user.name "recompete-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A docs
          if [ -d out ]; then git add -A out; fi
          if [ -f data/platform.sqlite3 ]; then git add -f data/platform.sqlite3; fi
          if [ -f data/kr_store.sqlite3 ]; then git add -f data/kr_store.sqlite3; fi
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "daily update $(date -u +%Y-%m-%d)"
          # 사용자가 그 사이 푸시했을 수 있으므로 rebase 후 푸시 (3회 재시도)
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main || { git rebase --abort; sleep 5; }
          done
          git push

      # ── 선택: Firebase Hosting 배포 ─────────────────────────────
      # Secret 에 FIREBASE_SERVICE_ACCOUNT(서비스계정 JSON)와
      # FIREBASE_PROJECT_ID 를 넣고 아래 주석을 해제하면
      # 같은 결과물이 Firebase Hosting 으로도 배포된다.
      #
      # - name: Deploy to Firebase Hosting
      #   uses: FirebaseExtended/action-hosting-deploy@v0
      #   with:
      #     repoToken: ${{ secrets.GITHUB_TOKEN }}
      #     firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      #     projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
      #     channelId: live
